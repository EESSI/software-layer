# 2026.10.11
# numpy 2.4 raised its default x86-64 cpu-baseline to x86-64-v2 (SSSE3, SSE4.1, SSE4.2, POPCNT, ...),
# so the numpy in the x86_64/generic installation refuses to import on CPUs that only have x86-64 (SSE2):
# "NumPy was built with baseline optimizations: (X86_V2) but your machine doesn't support: (...)"
# numpy is now built with cpu-baseline=none for x86_64/generic by the pre_single_extension_numpy
# hook in https://github.com/EESSI/software-layer-scripts (eb_hooks.py);
# the dispatched code paths for x86-64-v2 and newer are still selected at runtime.
# Only the x86_64/generic installation needs to be rebuilt, so only build this for that target
# (arch:x86_64/generic).
easyconfigs:
  - SciPy-bundle-2026.05-gfbf-2026.1.eb:
      options:
        # same easyconfig as the current installation
        from-commit: 3dd90510b931c9a40af18df1d9bed75e1a1dc8e0
