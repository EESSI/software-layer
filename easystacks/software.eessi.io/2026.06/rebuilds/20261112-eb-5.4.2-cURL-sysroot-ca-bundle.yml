# rebuild cURL so it uses the CA bundle from the compat layer instead of the host,
# see https://github.com/easybuilders/easybuild-easyblocks/pull/4281
# and https://github.com/easybuilders/easybuild-easyconfigs/pull/27426
easyconfigs:
  - cURL-8.17.0-GCCcore-15.2.0.eb:
      options:
        from-pr: 27426
        include-easyblocks-from-pr: 4281
  # cargo's DT_RPATH records the libcurl it was linked against; the CMake build
  # dependency pulls cURL in, so cargo keeps the host CA bundle until Rust is rebuilt
  - Rust-1.94.1-GCCcore-15.2.0.eb
