#   - ollama: https://github.com/easybuilders/easybuild-easyconfigs/pull/27366
easyconfigs:
  - caddy-2.10.2.eb
  - OBITools4-4.5.0-GCCcore-14.3.0.eb
  - ollama-0.6.0-GCCcore-13.3.0.eb:
      options:
        from-commit: 57091b51a62b1205f23f1ba32b15b6da63148726
