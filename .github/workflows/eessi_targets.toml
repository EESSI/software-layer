[accelerator_targets."2023.06"]
# Provide a default set of compute capabilities
default = [
  "nvidia/cc70",
  "nvidia/cc80",
  "nvidia/cc90",
]
# and then allow for special cases for specific CPU targets
"aarch64/a64fx" = []
"x86_64/amd/zen2" = [
  "nvidia/cc70",
  "nvidia/cc80",
  "nvidia/cc90",
]

