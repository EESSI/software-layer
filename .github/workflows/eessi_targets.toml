# Supported targets per EESSI version, shared by the CI workflows and scripts.
#
# cpu_targets: should correspond with the table @ https://eessi.io/docs/software_layer/cpu_targets/
#   Per EESSI version, the CPU targets for each CPU family.
# accelerator_targets: should correspond with the table @ https://eessi.io/docs/software_layer/gpu_targets/
#   Per EESSI version, the accelerator targets to build for. 'default' applies to every CPU target,
#   unless a CPU target has an entry of its own (which may be empty, i.e. no accelerators).

[cpu_targets."2023.06"]
aarch64 = [
  "aarch64/a64fx",
  "aarch64/generic",
  "aarch64/neoverse_n1",
  "aarch64/neoverse_v1",
  "aarch64/nvidia/grace",
]
x86_64 = [
  "x86_64/amd/zen2",
  "x86_64/amd/zen3",
  "x86_64/amd/zen4",
  "x86_64/generic",
  "x86_64/intel/cascadelake",
  "x86_64/intel/haswell",
  "x86_64/intel/icelake",
  "x86_64/intel/sapphirerapids",
  "x86_64/intel/skylake_avx512",
]

